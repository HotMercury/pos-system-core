<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小巷裡｜管理後台</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section id="login-view" class="login-card">
        <p class="eyebrow">ALLEY CAFE & BISTRO</p>
        <h1>店務管理</h1>
        <p class="muted">管理商品販售狀態與規格價格</p>
        <form id="login-form">
          <label for="pin">管理 PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required />
          <button class="primary-button" type="submit">登入</button>
          <p id="login-error" class="error"></p>
        </form>
      </section>

      <section id="admin-view" class="hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">ALLEY CAFE & BISTRO</p>
            <h1>商品管理</h1>
          </div>
          <button id="logout" class="secondary-button" type="button">登出</button>
        </header>
        <p id="feedback" class="feedback" role="status"></p>
        <div id="products" class="products"></div>
        <section class="promotion-section">
          <div class="section-heading"><h2>優惠碼</h2></div>
          <form id="promotion-form" class="promotion-form">
            <input name="code" placeholder="例如 ALLEY10" required />
            <select name="discountType"><option value="PERCENTAGE">折數 %</option><option value="FIXED">折抵金額</option></select>
            <input name="value" type="number" min="0" placeholder="10" required />
            <input name="minAmount" type="number" min="0" placeholder="最低消費" />
            <input name="maxUses" type="number" min="1" placeholder="不限次數" />
            <button class="primary-button" type="submit">新增優惠碼</button>
          </form>
          <div id="promotions" class="promotions"></div>
        </section>
      </section>
    </main>
    <script src="/admin/app.js"></script>
  </body>
</html>
