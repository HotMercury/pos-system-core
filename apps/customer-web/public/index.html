<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>桌邊點餐</title>
    <link rel="stylesheet" href="/customer/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand-lockup">
          <img class="brand-logo" src="/customer/images/logo.png" alt="小巷裏 Alley Cafe & Bistro" />
        </div>
        <div class="hero-copy">
          <p class="eyebrow">ALLEY CAFE & BISTRO</p>
          <h1>今天想喝什麼？</h1>
          <p id="table-label" class="muted">讀取桌位中...</p>
          <div class="order-mode" role="group" aria-label="訂單類型">
            <button class="mode-button" data-order-type="DINE_IN" type="button">內用</button>
            <button class="mode-button" data-order-type="TAKEAWAY" type="button">外帶</button>
          </div>
        </div>
      </header>

      <section id="menu" class="menu" aria-live="polite"></section>

      <section id="cart-panel" class="cart-panel hidden">
        <div class="section-heading">
          <h2>你的訂單</h2>
          <span id="cart-count" class="pill">0</span>
        </div>
        <div id="cart-items"></div>
        <div class="cart-total"><span>合計</span><strong id="cart-total">$0</strong></div>
        <div class="promo-row">
          <input id="promo-code" type="text" placeholder="有優惠碼嗎？" autocomplete="off" />
        </div>
        <button id="submit-order" class="primary-button">送出現金訂單</button>
      </section>

      <section id="order-panel" class="order-panel hidden" aria-live="polite">
        <div class="section-heading"><h2>我的訂單</h2><button id="new-order" class="new-order-button" type="button">再點一單</button></div>
        <div id="order-list"></div>
      </section>
    </main>
    <div id="variant-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="variant-title">
        <button class="modal-close" type="button" data-close-modal aria-label="關閉">×</button>
        <p class="eyebrow">CUSTOMIZE YOUR DRINK</p>
        <h2 id="variant-title"></h2>
        <p id="variant-description" class="muted"></p>
        <div id="variant-options" class="modal-options"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/customer/app.js"></script>
  </body>
</html>
